<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense - Web Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #121214;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1280px;
            max-width: 100vw;
            height: 720px;
            max-height: calc(100vw * 9 / 16);
            background: #000;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas.emscripten {
            width: 100%;
            height: 100%;
            display: block;
            border: 0 none;
            outline: none;
        }
        #loading-overlay {
            position: absolute;
            inset: 0;
            background: #18181b;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .spinner {
            width: 56px;
            height: 56px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #status {
            font-size: 18px;
            font-weight: 500;
            color: #d1d5db;
            margin-bottom: 8px;
        }
        #substatus {
            font-size: 13px;
            color: #9ca3af;
        }
        #footer {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="status">Загрузка игры...</div>
            <div id="substatus">Подготовка WebAssembly & WebGL2</div>
        </div>
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>
    <div id="footer">
        Tower Defense Web (WebAssembly / WebGL2) &bull; Нажмите на экран для фокуса и звука
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var substatusElement = document.getElementById('substatus');
        var loadingOverlay = document.getElementById('loading-overlay');
        var canvas = document.getElementById('canvas');

        var Module = {
            preRun: [],
            postRun: [function() {
                if (loadingOverlay) {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(function() {
                        loadingOverlay.style.visibility = 'hidden';
                    }, 400);
                }
            }],
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            },
            canvas: (function() {
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                if (m) {
                    text = m[1] + '(' + Math.round(parseFloat(m[2]) / parseFloat(m[4]) * 100) + '%)';
                }
                if (statusElement) statusElement.innerText = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Загрузка ассетов... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'Все компоненты готовы.');
            }
        };

        Module.setStatus('Загрузка...');
        window.onerror = function(event) {
            Module.setStatus('Произошла ошибка при загрузке.');
            if (substatusElement) substatusElement.innerText = 'Откройте DevTools консоль (F12) для деталей.';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
